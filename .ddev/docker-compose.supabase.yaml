services:
  # Supabase PostgreSQL Database
  supabase-db:
    image: postgres:15
    container_name: ddev-${DDEV_SITENAME}-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DDEV_PRIMARY_DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d
    networks:
      - default
    ports:
      - "54322:5432"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
      com.ddev.app-url: ${DDEV_URL}
    healthcheck:
      disable: true

  # Supabase Auth Service (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.139.0
    container_name: ddev-${DDEV_SITENAME}-supabase-auth
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9998
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${DDEV_PRIMARY_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://${DDEV_URL}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ALGORITHM: HS256
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: admin@email.com
      GOTRUE_MAILER_URLPATHS_INVITE: http://${DDEV_URL}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: http://${DDEV_URL}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: http://${DDEV_URL}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: http://${DDEV_URL}/auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 3600
      GOTRUE_RATE_LIMIT_SMS_SENT: 3600
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SESSIONS_TIMEBOX: 2419200h
      GOTRUE_SESSIONS_SINGLE_PER_USER: "true"
    depends_on:
      - supabase-db
    networks:
      - default
    ports:
      - "9998:9999"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
      com.ddev.app-url: ${DDEV_URL}

  # Supabase PostgREST
  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: ddev-${DDEV_SITENAME}-supabase-rest
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      PGRST_DB_URI: postgresql://postgres:${DDEV_PRIMARY_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      - supabase-db
    networks:
      - default
    ports:
      - "9996:3000"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
      com.ddev.app-url: ${DDEV_URL}

  # Supabase Kong API Gateway
  supabase-kong:
    image: kong:3.4
    container_name: ddev-${DDEV_SITENAME}-supabase-kong
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      CORS_ORIGINS: "*"
    command: kong start --vv
    volumes:
      - ./supabase/kong/kong.yml:/kong/declarative/kong.yml
    depends_on:
      - supabase-auth
      - supabase-rest
    networks:
      - default
    ports:
      - "9995:8000"
      - "9994:8001"
      - "9993:8002"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
      com.ddev.app-url: ${DDEV_URL}

  # Supabase Studio - GUI for database management
  supabase-studio:
    image: supabase/studio:latest
    container_name: ddev-${DDEV_SITENAME}-supabase-studio
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      POSTGRES_PASSWORD: ${DDEV_PRIMARY_DB_PASSWORD:-postgres}
      DEFAULT_ORGANIZATION_NAME: ${DDEV_SITENAME}
      DEFAULT_PROJECT_NAME: ${DDEV_SITENAME}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:9995
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}
      DATABASE_URL: postgresql://postgres:${DDEV_PRIMARY_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
      # Studio specific settings
      STUDIO_PG_META_URL: http://supabase-rest:3000
      STUDIO_DEFAULT_ORGANIZATION: ${DDEV_SITENAME}
      STUDIO_DEFAULT_PROJECT: ${DDEV_SITENAME}
      # Fix for Studio binding - bypass Kong and connect directly
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:9996
      NEXT_PUBLIC_SITE_URL: http://localhost:9990
      SUPABASE_PUBLIC_URL: http://localhost:9996
      # Direct database connection
      POSTGRES_PASSWORD: ${DDEV_PRIMARY_DB_PASSWORD:-postgres}
      POSTGRES_DB_URL: postgresql://postgres:${DDEV_PRIMARY_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
    depends_on:
      - supabase-db
      - supabase-rest
      - supabase-auth
    networks:
      - default
    ports:
      - "9990:3000"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
      com.ddev.app-url: ${DDEV_URL}

# Email testing service (Mailpit - better than Inbucket)
  mailpit:
    image: axllent/mailpit:latest
    container_name: ddev-${DDEV_SITENAME}-mailpit
    restart: unless-stopped
    networks:
      - default
    ports:
      - "9988:8025"  # Mailpit web interface
      - "9987:1025"  # SMTP port
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_HTTP_BIND_ADDR: 0.0.0.0:8025
    volumes:
      - mailpit-data:/data
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
      com.ddev.app-url: ${DDEV_URL}

volumes:
  supabase-db-data:
    name: ${DDEV_SITENAME}-supabase-db-data
  mailpit-data:
    name: ${DDEV_SITENAME}-mailpit-data

networks:
  default:
    name: ddev-${DDEV_SITENAME}_default