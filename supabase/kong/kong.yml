_format_version: "3.0"

services:
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1
        paths: ["/auth/v1"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["HEAD", "GET", "POST", "PUT", "PATCH", "DELETE"]
          headers: ["accept", "authorization", "content-type", "x-client-info", "apikey"]
          exposed_headers: ["Content-Length", "Content-Range"]

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1
        paths: ["/rest/v1"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["HEAD", "GET", "POST", "PUT", "PATCH", "DELETE"]
          headers: ["accept", "authorization", "content-type", "x-client-info", "apikey", "range"]
          exposed_headers: ["Content-Length", "Content-Range"]